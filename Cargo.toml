[package]
name = "d-shell-bin"
version = "0.0.1"
edition = "2024"

[dependencies]
d-shell = {path="d-shell"}

[workspace]
resolver = "3"
members = ["d-shell", "d-shell-edit", "d-shell-wasm"]

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
